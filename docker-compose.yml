services:
  loot-ledger:
    build:
      context: .
      # Tiene que coincidir con el BASE_PATH de "environment:" acá abajo --
      # una sola variable en el .env de la raíz del repo controla las dos
      # (cliente horneado en el build + backend en runtime). Si cambiás
      # BASE_PATH hace falta reconstruir la imagen ("--build"), no alcanza
      # con reiniciar el contenedor: queda horneado en los assets del build.
      args:
        BASE_PATH: ${BASE_PATH:-}
    image: loot-ledger:latest
    container_name: loot-ledger
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/server/data/loot-ledger.db
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-11223344}
      INVITE_CORS_ORIGIN: ${INVITE_CORS_ORIGIN:-https://castielo.duckdns.org}
      # Subpath bajo el que cuelga la app (ej. "/loot-ledger" para
      # www.castielo.io/loot-ledger). Vacío por defecto = raíz del dominio,
      # como siempre. Ver server/src/base-path.js.
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - loot_ledger_data:/app/server/data

  # Opcional: expone la app en internet a través de un túnel saliente de
  # Cloudflare, sin abrir puertos en el router y con HTTPS automático.
  # No arranca con "docker compose up -d" normal: hace falta el perfil
  # "tunnel" (ver docs/deploy-ssd-domain.md) y la variable
  # CLOUDFLARE_TUNNEL_TOKEN en server/.env o en el entorno.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: loot-ledger-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      # Sin valor requerido a propósito: Docker Compose interpola las
      # variables de TODOS los servicios (incluso los de otros perfiles)
      # antes de filtrar por perfil, así que un "${VAR:?...}" acá rompería
      # también el "docker compose up -d" normal, sin el perfil "tunnel".
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - loot-ledger
    profiles:
      - tunnel
    # "default" (para llegar a "loot-ledger:3000") + "edge" (compartida con
    # otros compose/repos en la misma Pi, ej. castielo-web, para poder
    # rutear ambos hostnames/paths desde un único túnel -- ver
    # docs/deploy-ssd-domain.md). Hay que declarar "default" explícitamente
    # porque en cuanto se define "networks:" para un servicio, Compose deja
    # de sumarlo solo.
    networks:
      - default
      - edge

  # Alternativa gratis a Cloudflare Tunnel para probar el acceso remoto sin
  # comprar un dominio todavía: DuckDNS le pone nombre a tu IP pública de
  # casa, y Caddy hace de reverse proxy con HTTPS automático (Let's Encrypt)
  # delante de la app. Necesita que tu conexión NO esté detrás de CGNAT y
  # que abras los puertos 80 y 443 del router hacia la Pi (ver
  # docs/deploy-ssd-domain.md). Se activa con el perfil "duckdns":
  #   docker compose --profile duckdns up -d
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: loot-ledger-duckdns
    restart: unless-stopped
    environment:
      # SUBDOMAINS acepta una lista separada por comas (ej.
      # "loot-ledger,castielo") para renovar varios subdominios de la MISMA
      # cuenta/token de DuckDNS con este único contenedor.
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      LOG_FILE: "false"
    profiles:
      - duckdns

  caddy:
    image: caddy:2-alpine
    container_name: loot-ledger-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Cambiar a "www.loot-ledger.io" (o lo que sea) el día que se compre
      # el dominio: es el único lugar que hay que tocar para migrar.
      DOMAIN: ${PUBLIC_DOMAIN:-loot-ledger.duckdns.org}
      # Segundo dominio que sirve esta misma instancia de Caddy (ver
      # deploy/Caddyfile) -- hoy el portfolio (castielo-web), corriendo en
      # otro compose/repo pero en la misma Pi, conectado por la red "edge".
      PORTFOLIO_DOMAIN: ${PORTFOLIO_DOMAIN:-castielo.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - loot-ledger
    profiles:
      - duckdns
    # "default" (la red que ya usa para hablarle a "loot-ledger") + "edge"
    # (compartida con otros compose/repos en la misma Pi, ej. castielo-web)
    # -- hay que declarar "default" explícitamente porque en cuanto se
    # define "networks:" para un servicio, Compose deja de sumarlo solo.
    networks:
      - default
      - edge

volumes:
  loot_ledger_data:
    name: loot_ledger_data
  caddy_data:
  caddy_config:

networks:
  default: {}
  # Creada a mano una sola vez con "docker network create edge" -- no la
  # gestiona este compose, solo se conecta. Cualquier otro contenedor (de
  # otro repo/compose) que se una a "edge" con su container_name se vuelve
  # alcanzable por Caddy con ese nombre, sin publicar puertos al host.
  edge:
    external: true
