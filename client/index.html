<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loot Ledger</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />

    <!-- PWA: permite "Agregar a pantalla de inicio" y que abra sin la
         barra del navegador, ocupando toda la pantalla como una app.
         %BASE_URL% lo reemplaza Vite por el "base" configurado en
         vite.config.js (ver BASE_PATH) -- así estos links siguen
         apuntando bien tanto en la raíz del dominio como en un subpath. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" id="theme-color-meta" content="#07070c" />
    <!-- Aplica el tema claro/oscuro guardado ANTES de que React monte, para
         no mostrar un flash del tema oscuro por defecto si la persona ya
         había elegido claro (mismo storage key que LanguageContext.jsx). -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("loot_ledger_theme");
          if (theme === "light") {
            document.documentElement.dataset.theme = "light";
            document.addEventListener("DOMContentLoaded", function () {
              var meta = document.getElementById("theme-color-meta");
              if (meta) meta.setAttribute("content", "#f6f8fb");
            });
          }
        } catch (e) {
          /* localStorage no disponible */
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loot Ledger" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
